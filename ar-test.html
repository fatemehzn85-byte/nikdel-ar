<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AR test</title>
<style>
body{margin:0;font-family:sans-serif;background:#222;color:#eee}
model-viewer{width:100%;height:70vh;background:#555}
.bar{padding:12px;display:flex;gap:8px;flex-wrap:wrap}
a,button{font-size:16px;padding:12px 16px;border-radius:10px;border:0;background:#cdb995;color:#111;text-decoration:none}
#ar{position:absolute;bottom:90px;right:16px}
p{padding:0 12px;font-size:13px;word-break:break-all}
</style></head><body>
<model-viewer id="mv" camera-controls ar ar-modes="webxr scene-viewer quick-look" shadow-intensity="1">
  <button slot="ar-button" id="ar">View in AR</button>
</model-viewer>
<div class="bar">
  <a href="ar-test.html">Test 1: our curtain</a>
  <a href="ar-test.html#astro">Test 2: astronaut (needs internet)</a>
</div>
<p id="info"></p>
<script src="model-viewer-umd.min.js"></script>
<script>
var mv=document.getElementById('mv');
var astro = location.hash === '#astro';
mv.setAttribute('src', astro ? 'https://modelviewer.dev/shared-assets/models/Astronaut.glb' : 'decorative_curtain.glb');
if(!astro) mv.setAttribute('ios-src','decorative_curtain.usdz');
document.getElementById('info').textContent = 'model: ' + (astro?'astronaut':'curtain');
window.addEventListener('hashchange',function(){location.reload();});
</script></body></html>
